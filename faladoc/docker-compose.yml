version: '3.8'
services:
  expo-app:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
      - ./entrypoint.sh:/usr/src/app/entrypoint.sh
    entrypoint: /usr/src/app/entrypoint.sh
    environment:
      - NODE_VERSION=20.11.1
    ports:
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
      - '8081:8081'
