version: '3.8'

services:
  expo-app:
    build: 
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_VERSION=20.11.1
    ports:
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
      - '8081:8081'
