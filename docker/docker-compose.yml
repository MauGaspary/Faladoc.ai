version: '3.8'

services:
  expo-app:
    build:
      context: ..
      dockerfile: docker/dockerfile
    volumes:
      - ..:/app
      - /app/node_modules
    env_file:
      - ../.env
    environment:
      - NODE_VERSION=20.11.1
    ports:
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
      - '8081:8081'
    command: ["/bin/bash", "/app/docker/build.sh"]
