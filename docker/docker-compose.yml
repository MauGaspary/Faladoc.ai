version: '3.8'
services:
  express-app:
    container_name: expo-app-back
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - RUNNING_IN_DOCKER=false
      - CORS_ORIGIN=http://localhost:8081

